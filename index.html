<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FishFly — Coming Soon</title>
<meta name="description" content="FishFly is in progress. The Saltwater Fly Library is live now." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f3ec;
  --bg-alt: #efe9df;
  --text: #1a1f2e;
  --text-soft: #4a5568;
  --text-muted: #8b8478;
  --accent: #1e3a5f;
  --accent-soft: #2a4d7a;
  --rule: #d8d2c4;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.serif { font-family: "Playfair Display", Georgia, serif; }

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.card {
  max-width: 560px;
  text-align: center;
}

.eyebrow {
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--accent);
  margin-bottom: 1rem;
}

.tagline {
  font-size: 1.125rem;
  color: var(--text-soft);
  margin-bottom: 2.5rem;
  font-style: italic;
}

.divider {
  width: 60px;
  height: 1px;
  background: var(--rule);
  margin: 0 auto 2.5rem;
}

.status {
  font-size: 1rem;
  color: var(--text-soft);
  margin-bottom: 2rem;
}

.library-link {
  display: inline-block;
  font-size: 1rem;
  font-weight: 500;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
  padding-bottom: 2px;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.library-link:hover {
  color: var(--accent-soft);
  border-bottom-color: var(--accent);
}

.library-link .arrow {
  display: inline-block;
  margin-left: 0.4em;
  transition: transform 0.15s ease;
}

.library-link:hover .arrow {
  transform: translateX(3px);
}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow">FishFly</div>
    <h1 class="serif">Coming soon</h1>
    <p class="tagline">Landing page in progress.</p>
    <div class="divider"></div>
    <p class="status">In the meantime, the Saltwater Fly Library is live.</p>
    <a class="library-link" href="/library/">
      Explore the Fly Library <span class="arrow">→</span>
    </a>
  </div>
</main>
</body>
</html>
