<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/brand/marks/compass-filled-disc.svg">
  <title>Confirmation failed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f7f3ec;
      --ocean: #1e3a5f;
      --sand: #c89668;
      --rust: #8b3a3a;
      --text-primary: #1a1f2e;
      --text-soft: #4a5568;
      --rule: #d8d2c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: var(--bg-cream);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 0 24px 80px;
    }
    .container { max-width: 560px; margin: 0 auto; text-align: center; padding-top: 64px; }

    /* Site nav (matches eat-window pattern) */
    .site-nav {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .site-nav-brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: 24px;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .site-nav-brand .dot { color: var(--sand); margin: 0 3px; }
    .site-nav .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }
    .site-nav .nav-links a {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-soft);
      text-decoration: none;
      transition: color 120ms ease;
    }
    .site-nav .nav-links a:hover,
    .site-nav .nav-links a.active { color: var(--ocean); }
    .site-nav .nav-links a.active { font-weight: 600; }
    @media (max-width: 640px) {
      .site-nav { padding: 20px 20px; flex-wrap: wrap; gap: 12px 16px; }
      .site-nav .nav-links { gap: 16px; font-size: 13px; }
    }

    .tagline {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 11px;
      color: var(--sand);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.15;
      margin-bottom: 24px;
      color: var(--rust);
    }
    p { font-size: 17px; color: var(--text-soft); margin-bottom: 16px; }
    .reason {
      background: rgba(139, 58, 58, 0.08);
      border-left: 4px solid var(--rust);
      padding: 14px 18px;
      margin: 24px 0;
      text-align: left;
      font-size: 14px;
    }
    .button {
      display: inline-block;
      background: var(--ocean);
      color: #ffffff;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <a href="/" class="site-nav-brand">fish<span class="dot">·</span>fly</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/library/">Library</a>
      <a href="/scout/" class="active">Trip Scout</a>
      <a href="/eat-window/">Eat Window</a>
      <a href="/about/">About</a>
      <a href="/blog/">Blog</a>
    </div>
  </nav>

  <div class="container">
    <div class="tagline">Trip Scout</div>

    <h1>Confirmation didn't work.</h1>
    <p>The link you clicked is either expired, invalid, or already used. No worries — submit the form again and we'll send a fresh link.</p>

    <div class="reason" id="reason-block" style="display:none">
      <strong>Reason:</strong> <span id="reason"></span>
    </div>

    <a class="button" href="/scout">Start a new request</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reason = params.get("reason");
    if (reason) {
      document.getElementById("reason").textContent = reason.replace(/_/g, " ");
      document.getElementById("reason-block").style.display = "block";
    }
  </script>
</body>
</html>
