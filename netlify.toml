# Netlify configuration for fishfly-ai
#
# Hosts two products on a single site:
#   - The Saltwater Fly Library + landing chrome (publish=".")
#   - Trip Scout at /scout/*  (intake form, magic-link confirm,
#     background Claude generation, persistent reports)

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Trip Scout functions need scout-lib/; Bite Window functions need bite-lib/
  # AND scout-lib/ (Bite Window reuses crypto.mjs, email.mjs, worldtides.mjs,
  # stormglass.mjs, render-prime-eat-window.mjs, render-css.mjs).
  included_files = ["scout-lib/**", "bite-lib/**"]

# Background function — full 15-min timeout
[functions."scout-generate-background"]
  timeout = 900

# ---- Header policy ----

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Reports are designed to be embeddable in same-origin previews; relax DENY here only.
[[headers]]
  for = "/scout/r/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# ---- Trip Scout function routing ----
# Rewrites (status 200) keep the user-facing URL at fishfly.ai/scout/...
# while the function executes server-side.

[[redirects]]
  from = "/scout/api/intake"
  to = "/.netlify/functions/scout-intake"
  status = 200

[[redirects]]
  from = "/scout/api/confirm"
  to = "/.netlify/functions/scout-confirm"
  status = 200

[[redirects]]
  from = "/scout/api/status"
  to = "/.netlify/functions/scout-status"
  status = 200

[[redirects]]
  from = "/scout/r/*"
  to = "/.netlify/functions/scout-report"
  status = 200

[[redirects]]
  from = "/scout/health"
  to = "/.netlify/functions/scout-health"
  status = 200

# --- Trip Scout admin (private — gated by ADMIN_KEY env var) ---

[[redirects]]
  from = "/scout/admin/intakes"
  to = "/.netlify/functions/scout-admin-intakes"
  status = 200

[[redirects]]
  from = "/scout/admin/intakes.json"
  to = "/.netlify/functions/scout-admin-intakes"
  status = 200

[[redirects]]
  from = "/scout/admin/intakes.csv"
  to = "/.netlify/functions/scout-admin-intakes"
  status = 200

# --- Bite Window API (PR #26: Mapbox geocoding proxy) ---

[[redirects]]
  from = "/bite-window/api/geocode"
  to = "/.netlify/functions/bite-window-geocode"
  status = 200

# --- Bite Window backend (PR #27: submit, confirm, report viewer) ---

[[redirects]]
  from = "/bite-window/api/submit"
  to = "/.netlify/functions/bite-window-submit"
  status = 200

[[redirects]]
  from = "/bite-window/api/confirm"
  to = "/.netlify/functions/bite-window-confirm"
  status = 200

[[redirects]]
  from = "/bite-window/r/*"
  to = "/.netlify/functions/bite-window-report"
  status = 200
